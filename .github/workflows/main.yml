name: Build Alpha AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -o AlphaAI_DevilBreath_AndroidStudio_Starter.zip -d source
          PROJECT_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Java and Kotlin JVM targets
        run: |
          cat > "$RUNNER_TEMP/jvm-target.gradle" <<'EOF'
          allprojects {
            tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
              sourceCompatibility = '17'
              targetCompatibility = '17'
            }
            tasks.configureEach { task ->
              if (task.class.name.contains('KotlinCompile') && task.hasProperty('kotlinOptions')) {
                task.kotlinOptions.jvmTarget = '17'
              }
            }
          }
          EOF

      - name: Build APK
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" -I "$RUNNER_TEMP/jvm-target.gradle" -p "$PROJECT_DIR" :app:assembleDebug
          else
            gradle -I "$RUNNER_TEMP/jvm-target.gradle" -p "$PROJECT_DIR" :app:assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlphaAI-Debug-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
