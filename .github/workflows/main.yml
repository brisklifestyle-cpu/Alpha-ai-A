name: Build Alpha AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Select Android project source
        run: |
          if [ -f "android_studio/settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/android_studio"
          else
            unzip -o AlphaAI_DevilBreath_AndroidStudio_Starter.zip -d source
            PROJECT_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
            if [ -z "$PROJECT_FILE" ]; then
              echo "Gradle project not found"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$PROJECT_FILE")
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Package extracted Android source for review
        if: always()
        run: |
          if [ -d android_studio ]; then
            find android_studio -type f | sort > alphaai-source-manifest.txt
            zip -qr alphaai-source-review.zip android_studio
          elif [ -d source ]; then
            find source -type f | sort > alphaai-source-manifest.txt
            zip -qr alphaai-source-review.zip source
          else
            echo "Source directory missing" > alphaai-source-manifest.txt
          fi

      - name: Upload Android source for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlphaAI-Android-Source-Review
          path: |
            alphaai-source-review.zip
            alphaai-source-manifest.txt
          if-no-files-found: warn

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Java and Kotlin JVM targets
        run: |
          cat > "$RUNNER_TEMP/jvm-target.gradle" <<'EOF'
          import org.gradle.api.JavaVersion
          import org.gradle.api.tasks.compile.JavaCompile

          // Configure Android while its plugin is being applied, before AGP
          // finalizes compileOptions during project configuration.
          gradle.beforeProject { project ->
            def alignAndroid = {
              def androidExtension = project.extensions.findByName('android')
              if (androidExtension != null) {
                androidExtension.compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                }
              }
            }

            project.plugins.withId('com.android.application') { alignAndroid() }
            project.plugins.withId('com.android.library') { alignAndroid() }

            // Match all Java and Kotlin compilation tasks to JVM 17.
            project.tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = JavaVersion.VERSION_17.toString()
              targetCompatibility = JavaVersion.VERSION_17.toString()
            }
            project.plugins.withId('org.jetbrains.kotlin.android') {
              project.tasks.configureEach { task ->
                if (task.class.name.contains('KotlinCompile') && task.hasProperty('kotlinOptions')) {
                  task.kotlinOptions.jvmTarget = '17'
                }
              }
            }
          }
          EOF

      - name: Build APK
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" -I "$RUNNER_TEMP/jvm-target.gradle" -p "$PROJECT_DIR" :app:assembleDebug
          else
            gradle -I "$RUNNER_TEMP/jvm-target.gradle" -p "$PROJECT_DIR" :app:assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlphaAI-Debug-APK
          path: |
            android_studio/app/build/outputs/apk/debug/*.apk
            source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
